px}.radio-line input{width:auto}.demo-strip{font-size:11px;color:#715c45;background:#eee5d4;padding:9px 12px;border:1px solid #d5c3a3;border-radius:7px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{padding:24px;text-align:center;border:1px dashed #ccbfa8;color:#797365;border-radius:8px}.empty strong{display:block;margin-bottom:6px;color:#3b4d59}.toast{position:fixed;bottom:25px;right:24px;background:#283f51;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 10px 30px #0004;font-size:13px;z-index:35;max-width:320px}.print-only{display:none}.rule-alert{border-left:3px solid #c5795d;padding-left:12px;font-weight:700;color:#8b5348;margin:15px 0 20px;font-size:12px;line-height:1.6}

<script>
const SEED = {
  "chapters": [
    {
      "id": "start",
      "title": "Getting Started",
      "tag": "Fundamentals",
      "icon": "✦"
    },
    {
      "id": "wireless",
      "title": "Wireless Sales",
      "tag": "Activations, upgrades & DF",
      "icon": "▣"
    },
    {
      "id": "internet",
      "title": "Internet Air",
      "tag": "Consumer internet",
      "icon": "◈"
    },
    {
      "id": "service",
      "title": "Account & Customer Service",
      "tag": "Everyday service transactions",
      "icon": "☷"
    },
    {
      "id": "business",
      "title": "Business & FirstNet",
      "tag": "Special account types",
      "icon": "▤"
    },
    {
      "id": "operations",
      "title": "Store Operations",
      "tag": "Daily routines",
      "icon": "⌂"
    },
    {
      "id": "resources",
      "title": "Resources & Reference",
      "tag": "Numbers, tools & terminology",
      "icon": "↗"
    }
  ],
  "guides": [
    {
      "id": "new-line",
      "title": "New Line — Phone",
      "chapter": "wireless",
      "summary": "Activate a new AT&T wireless account.",
      "status": "approved",
      "type": "procedure",
      "steps": [
        {
          "id": "before-you-start",
          "title": "Before You Start",
          "text": "Confirm new number versus port-in; accepted ID; new account rather than existing account; BYOD versus device purchase; current promotion and device availability. For port-ins, collect phone number, old-carrier account number, transfer PIN/credentials, and ZIP code. Do not tell the customer to cancel the previous carrier.",
          "opening": "open"
        },
        {
          "id": "salesforce---new-customer",
          "title": "Salesforce — New Customer",
          "text": "Use Salesforce to open New Customer → Wireless, enter the service address, complete verification and continue to OPUS. Exact menu labels should be checked during the next live walkthrough.",
          "opening": "closed"
        },
        {
          "id": "credit-check",
          "title": "Credit Check",
          "text": "In OPUS select Run Credit Check, then click Refresh. Wait until results populate and review financing restrictions before continuing.",
          "opening": "open"
        },
        {
          "id": "bundle-builder-and-offers",
          "title": "Bundle Builder & Offers",
          "text": "Review eligible offers, including switcher offers. Confirm customer choices before accepting any offers and before leaving Bundle Builder. Check current CCKM terms.",
          "opening": "open"
        },
        {
          "id": "device-selection",
          "title": "Device Selection",
          "text": "Choose model, storage and color. Discuss applicable protection, Next Up Anytime and accessories without enrolling the customer without consent. DO NOT use Park Equipment for New Line. For a shipped device, use the separate Direct Fulfillment guide.",
          "opening": "closed"
        },
        {
          "id": "down-payments",
          "title": "Down Payments",
          "text": "Explain any mandatory down payment first. Watch for the separate Optional Down Payment screen later in the flow—review the available choice with the customer or intentionally skip. It can be difficult to revisit.",
          "opening": "open"
        },
        {
          "id": "plan-and-phone-number",
          "title": "Plan & Phone Number",
          "text": "Select the agreed plan and check promotion requirements. Assign a new number or enter the port-in details. An in-store New Line port process begins immediately: do not attempt to hold service by parking equipment.",
          "opening": "closed"
        },
        {
          "id": "checkout-and-activation",
          "title": "Checkout & Activation",
          "text": "Confirm device, plan, phone number, offers, optional products, financing, taxes and fees. Review the monthly estimate and upfront total; submit with the customer’s approval. Verify calling, texting and data once active.",
          "opening": "open"
        },
        {
          "id": "resume-an-interrupted-activation",
          "title": "Resume an Interrupted Activation",
          "text": "If OPUS closes or the customer returns later: OPUS → Status & Eligibility → Pending Activations → select customer. OPUS returns to the Bundle Builder flow. Check the existing pending transaction before starting a duplicate.",
          "opening": "open"
        },
        {
          "id": "port-status",
          "title": "Port Status",
          "text": "Use https://www.att.com/portstatus/ to check a submitted transfer. A submitted port is not always complete. For a Direct Fulfillment port-in, the port activates when the received phone is turned on/activated.",
          "opening": "closed"
        }
      ],
      "revision": "Draft 1"
    },
    {
      "id": "add-line",
      "title": "Add-A-Line — Phone",
      "chapter": "wireless",
      "summary": "Add a phone line to an existing AT&T account.",
      "status": "approved",
      "type": "procedure",
      "steps": [
        {
          "id": "account-status-and-verification",
          "title": "Account Status & Verification",
          "text": "Verify the account holder/authorized user. PAST-DUE accounts may add a line but cannot upgrade. SUSPENDED accounts cannot transact. Confirm a new number or port-in and obtain credentials where needed.",
          "opening": "open"
        },
        {
          "id": "opus---add-new-mobile",
          "title": "OPUS — Add New Mobile",
          "text": "From Salesforce open the verified existing account → Go to OPUS. In OPUS Account Overview choose Add (upper left of account info) → Add New Mobile → Bundle Builder.",
          "opening": "open"
        },
        {
          "id": "offers-and-device",
          "title": "Offers & Device",
          "text": "Review accepted offers; choose model, storage and color. Explain applicable Next Up Anytime, insurance and accessories with customer consent. Parking equipment is NOT available on Add-A-Line. DF is chosen from catalog for shipping.",
          "opening": "closed"
        },
        {
          "id": "plan-and-current-group",
          "title": "Plan & Current Group",
          "text": "Select the plan and confirm the effect on the customer’s total monthly account charge. ALWAYS add the new line to the CURRENT GROUP; do not create a new group. Check promotional and 55+ plan requirements where relevant.",
          "opening": "open"
        },
        {
          "id": "number---port",
          "title": "Number / Port",
          "text": "Assign a new number or enter previous-carrier number, account number and transfer PIN. Submit the port and check status at https://www.att.com/portstatus/. Do not add a separate port-eligibility step.",
          "opening": "open"
        },
        {
          "id": "down-payment-and-checkout",
          "title": "Down Payment & Checkout",
          "text": "Review any mandatory and optional down payment screens. Confirm line, plan, device, add-ons, promotional conditions, installment terms, expected bill and amount due before checkout. Verify activation as applicable.",
          "opening": "open"
        },
        {
          "id": "interrupted-transaction",
          "title": "Interrupted Transaction",
          "text": "For an interrupted order, check OPUS → Status & Eligibility → Pending Activations before starting again. Confirm the same recovery path during Add-A-Line testing.",
          "opening": "closed"
        }
      ],
      "revision": "Draft 1"
    },
    {
      "id": "upgrade",
      "title": "Upgrade — Phone",
      "chapter": "wireless",
      "summary": "Standard, payoff, legacy Next Up and Next Up Anytime.",
      "status": "approved",
      "type": "procedure",
      "steps": [
        {
          "id": "eligibility-and-account-status",
          "title": "Eligibility & Account Status",
          "text": "Verify line and account. Past-due accounts cannot upgrade; suspended accounts cannot transact. Review installment balance, current device association, old promotional credits and desired device offer.",
          "opening": "open"
        },
        {
          "id": "start-in-opus",
          "title": "Start in OPUS",
          "text": "Salesforce → verified account → Go to OPUS → Sales Transactions → Upgrade → choose line. Regular upgrades may also be done directly in Salesforce; exact Salesforce steps are PENDING until documented.",
          "opening": "open"
        },
        {
          "id": "standard-upgrade",
          "title": "Standard Upgrade",
          "text": "Verify the line is eligible. Some promotions REQUIRE a qualifying trade-in; check CCKM before quoting. An upgrade alone does not guarantee promotional pricing.",
          "opening": "open"
        },
        {
          "id": "payoff-before-upgrade",
          "title": "Payoff Before Upgrade",
          "text": "In OPUS account, choose Installments on the LEFT side → expand the correct installment → Pay Off. VERIFY the device matches what the customer believes they are paying off; prior line/device changes may cause mismatches. Complete payoff BEFORE starting the upgrade. Some promotions also require trade-in; check CCKM.",
          "opening": "open"
        },
        {
          "id": "legacy-next-up---next-up-anytime",
          "title": "Legacy Next Up / Next Up Anytime",
          "text": "Legacy Next Up generally requires 50% paid for an eligible turn-in. NUA may permit a qualifying early upgrade after the first installment and NUA payment; 33% paid is the threshold for certain promotional smartphone offers. OPUS may offer turn-in, pay-to-33%, or payoff. Confirm exactly which offer applies before choosing. Next Up turn-ins are NOT ordinary promotional trade-ins.",
          "opening": "open"
        },
        {
          "id": "device-selection---park-before-add-device",
          "title": "Device Selection — Park Before Add Device",
          "text": "Select device model, storage and color. Check plan, promotion, protection and NUA choices. Park Equipment appears directly BELOW device selection, BEFORE Add Device. Select Park Equipment to DELAY activation and keep service on the existing phone. Then click Add Device.",
          "opening": "open"
        },
        {
          "id": "checkout-and-old-device",
          "title": "Checkout & Old Device",
          "text": "Review installment payment, promotion, turn-in or trade-in requirements, fees, add-ons, activation timing and credits. Complete checkout, verify activation at the intended time, explain old-device deadlines and retain confirmation.",
          "opening": "closed"
        },
        {
          "id": "pending:-salesforce-upgrade-and-recovery",
          "title": "Pending: Salesforce Upgrade & Recovery",
          "text": "Salesforce-direct standard upgrade clicks, interrupted upgrade recovery, and later activation for parked equipment are pending additional walkthroughs.",
          "opening": "closed"
        }
      ],
      "revision": "Draft 1"
    },
    {
      "id": "df",
      "title": "Direct Fulfillment (DF)",
      "chapter": "wireless",
      "summary": "Catalog device ordering, store delivery and pickup.",
      "status": "approved",
      "type": "procedure",
      "steps": [
        {
          "id": "choosing-in-store-vs-df",
          "title": "Choosing In-Store vs DF",
          "text": "At device selection, SCAN available equipment for in-store fulfillment, or choose the equipment from CATALOG for Direct Fulfillment. The catalog displays expected ship dates: review them with the customer.",
          "opening": "open"
        },
        {
          "id": "ship-to-store",
          "title": "Ship to Store",
          "text": "Choose SHIP TO STORE; avoid shipping wireless DF equipment directly to the customer. Verify model, storage, color, arrival estimate and store destination. Delivery requires a signature.",
          "opening": "open"
        },
        {
          "id": "shipping,-installments-and-port-timing",
          "title": "Shipping, Installments & Port Timing",
          "text": "Installments become active when the phone SHIPS. A DF port-in does NOT activate merely because the order ships; the port activates when the received phone is turned on/activated through the applicable process.",
          "opening": "open"
        },
        {
          "id": "when-device-arrives",
          "title": "When Device Arrives",
          "text": "Receive shipment, verify equipment, sign for delivery and call the customer as soon as the phone arrives. Follow up on unanswered calls. The eight-day guideline is flexible, not a hard automatic deadline; when a customer ghosts the store, management handles returning the device.",
          "opening": "open"
        },
        {
          "id": "order-cancellation-and-tracking",
          "title": "Order Cancellation & Tracking",
          "text": "Before shipment, cancel by calling RST or the customer may cancel in their AT&T app. Orders can be stopped for fraud review or unresolved ports, so check order and port status. Track through https://www.att.com/orders/checkmyorder.",
          "opening": "closed"
        },
        {
          "id": "pickup---activation-and-credits",
          "title": "Pickup / Activation & Credits",
          "text": "At pickup, verify the device/order, activate appropriately and confirm service. Activation issues are uncommon; unexpected loss of old service should be investigated. Promotional credits often take 1–3 billing cycles; escalate missing credits to management AFTER the third cycle.",
          "opening": "open"
        }
      ],
      "revision": "Draft 1"
    },
    {
      "id": "aia-c",
      "title": "Internet Air — Consumer (AIA-C)",
      "chapter": "internet",
      "summary": "Sell, activate and verify an All-Fi Hub in Salesforce.",
      "status": "approved",
      "type": "procedure",
      "steps": [
        {
          "id": "check-eligibility",
          "title": "Check Eligibility",
          "text": "AIA-C transactions are completed in SALESFORCE only. Enter the actual service address, check eligibility, discuss plan/pricing and explain self-installation at the customer’s home.",
          "opening": "open"
        },
        {
          "id": "start-the-salesforce-order",
          "title": "Start the Salesforce Order",
          "text": "New Customer: choose Salesforce New Customer → service address → New Service Opportunities → Internet Air. Existing customers: open and verify the account, then choose Internet Air under New Service Opportunities. Exact screen wording to reconfirm.",
          "opening": "open"
        },
        {
          "id": "verification---credit---extenders",
          "title": "Verification / Credit / Extenders",
          "text": "Complete the customer verification code and credit workflow. Explain any prepayment Salesforce displays. The earlier $0/$50/$100 values require confirmation; do not present as current fixed amounts. Offer an extender only if appropriate and with consent.",
          "opening": "closed"
        },
        {
          "id": "in-store-gateway-fulfillment",
          "title": "In-Store Gateway Fulfillment",
          "text": "Choose IN STORE in Salesforce; scan the gateway SERIAL NUMBER (S/N). Confirm correct equipment and SKIP shipping information. If gateway is out of stock, select shipping fulfillment and review delivery info and estimated timeline.",
          "opening": "open"
        },
        {
          "id": "activate-and-verify-active",
          "title": "Activate & Verify Active",
          "text": "Complete activation IN STORE. Check Salesforce again and VERIFY the device/service displays ACTIVE; do not assume submitted checkout means activated. This confirmation matters for correct transaction reporting and compensation.",
          "opening": "open"
        },
        {
          "id": "smart-home-manager-setup",
          "title": "Smart Home Manager Setup",
          "text": "Help customer install Smart Home Manager. If needed choose New User ID → set up for INTERNET AIR; use an existing AT&T ID when suitable. Verify app access and explain the hub placement and home Wi-Fi setup.",
          "opening": "open"
        },
        {
          "id": "pending-details",
          "title": "Pending Details",
          "text": "Exact activation clicks and current credit/prepay amounts are still to be checked. AIA-B business flow is ON HOLD while the process changes.",
          "opening": "closed"
        }
      ],
      "revision": "Draft 1"
    },
    {
      "id": "sim",
      "title": "SIM Change / eSIM",
      "chapter": "service",
      "summary": "Change a physical SIM or eSIM on an existing line.",
      "status": "approved",
      "type": "procedure",
      "steps": [
        {
          "id": "precheck",
          "title": "Precheck",
          "text": "Verify the customer and correct CTN, replacement device compatibility, IMEI and intended SIM type. Explain the currently quoted $5 service fee if OPUS applies it.",
          "opening": "open"
        },
        {
          "id": "physical-sim-change",
          "title": "Physical SIM Change",
          "text": "Open verified OPUS account → correct line → CLICK the device MAKE AND MODEL → locate SIM change options. Enter or scan the replacement ICCID, verify phone and IMEI, submit, insert SIM, restart if needed and test calls/text/data.",
          "opening": "open"
        },
        {
          "id": "esim-change",
          "title": "eSIM Change",
          "text": "Open the verified account, choose the device by make/model and locate the dedicated eSIM area. Exact OPUS label (possibly eSIM Status) is PENDING confirmation. Complete eSIM installation and verify service on the replacement phone.",
          "opening": "open"
        },
        {
          "id": "troubleshooting",
          "title": "Troubleshooting",

          "opening": "closed"
        }

    {
      "id": "billpay",
      "title": "Bill Payments",
      "chapter": "service",

      "status": "approved",
      "type": "procedure",
      "steps": [
        {
          "id": "consumer---from-salesforce-home",
          "title": "Consumer — From Salesforce Home",
          "text": "Salesforce Home → Assist Customer Now → Pay Bill → search using the phone number → select the correct account. Outside the account, the balance is not visible until entering the payment/account workflow.",

        },
        {
          "id": "consumer---from-an-open-account",
          "title": "Consumer — From an Open Account",
          "text": "Within the verified Salesforce account choose Billing & Payments → Pay Bill. Review the amount due as available.",
          "opening": "open"
        },
        {
          "id": "make-a-payment",
          "title": "Make a Payment",
          "text": "On Make a Payment, enter the customer-selected amount under Other. Read One-Time Payment Authorization Terms, obtain agreement, and only then check the consent box. Choose Debit/Credit Card or Cash. Saved cards require reauthorization. Select Pay on iPad and confirm the transaction succeeded. Final card-entry screen is pending.",

        },
        {
          "id": "cru-and-firstnet---opus",
          "title": "CRU & FirstNet — OPUS",
          "text": "For FirstNet Salesforce may show “Please go to OPUS to assist the FirstNet customer.” Select Go to OPUS, complete ID verification, then enter the verified account. Payments are on the LEFT within OPUS. Exact menu label is still pending.",
          "opening": "closed"
        },
        {
          "id": "payment-issues",
          "title": "Payment Issues",
          "text": "Do not submit a second payment before checking whether the first succeeded. Review declined transactions, partial balances, suspended service and payment arrangements through the appropriate account process.",
          "opening": "closed"
        }
      ],
      "revision": "Draft 1"

    {
      "id": "porting",
      "title": "Porting & Number Transfers",
      "chapter": "service",
      "summary": "Check an in-progress transfer and troubleshoot rejections.",
      "status": "approved",
      "type": "procedure",
      "steps": [
        {

          "title": "Before You Port",
          "text": "Collect existing carrier phone number, account number, transfer PIN or other required credentials and account ZIP. Do not cancel previous carrier service before transfer completes.",

        },
        {
          "id": "submit-and-check-status",
          "title": "Submit & Check Status",
          "text": "Use the New Line or Add-A-Line transaction. After submission open https://www.att.com/portstatus/ and check status using the number and AT&T account ZIP. Do not add a separate eligibility-check step.",
          "opening": "open"
        },
        {
          "id": "fix-port-errors-first",
          "title": "Fix Port Errors First",
          "text": "IF REJECTED or STUCK: review the displayed error, verify old carrier account number/PIN/ZIP and attempt the approved correction yourself. Recheck status. Call RST Option 1 (Port Department) only if unable to resolve it. Avoid duplicate activations.",

          "id": "df-ports---porting-out",
          "title": "DF Ports / Porting Out",
          "text": "DF ports activate when the delivered device is activated—not at shipment. For porting out of AT&T, the customer requests an AT&T Number Transfer PIN and lets the gaining carrier initiate the transfer; do not cancel first.",
          "opening": "closed"
        }
      ],

    {

      "title": "Returns & Exchanges",
      "chapter": "service",
      "summary": "Buyer’s remorse, returns, DOA and warranty routing.",
      "status": "approved",
      "type": "procedure",
      "steps": [
        {

        },
        {
          "id": "select-equipment-and-disable-find-my",
          "title": "Select Equipment & Disable Find My",
          "text": "On Transactions Details, select the correct return item and verify serial number. If Find My is enabled, have customer disable it and click Retry FMI Status Check; OPUS shows a manager-override warning if it remains enabled.",

        {
          "id": "reason---fee---return-tag",

          "text": "Enter Qty to Return → choose accurate Reason for Return → review displayed Restocking Fee (example $55) → Submit Returns → complete required Return Tag when prompted → confirm processing and receipt.",

        },

          "id": "buyer’s-remorse-disconnect-(brd)",

          "id": "defective---warranty---xbm",

          "text": "DOA may be handled during the applicable buyer’s remorse period. Eligible manufacturer warranty exchanges beyond 14 days but within one year may use Exchange by Mail (XBM): 800-801-1101. Verify Apple/foldable exceptions and CCKM rules.",

        },

          "id": "return-reasons",
          "title": "Return Reasons",
          "text": "BCQ: poor call quality/network; BCS: color/size/poor fit; BOS: out-of-stock item now available; BRD: buyer’s remorse disconnect; BTC: too complex/expensive; BTS: too simple; DOA: under-14-day DOA; IBM: Insurance By Mail exchanges only.",

let stored={};try{stored=JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch{}
let data={chapters:SEED.chapters,guides:stored.guides||structuredClone(SEED.guides),resources:SEED.resources,glossary:SEED.glossary};
let state={view:'home',chapter:'wireless',guide:'new-line',profile:stored.profile||'tj',mode:stored.mode||'clean',color:stored.color||COLORS[0],open:stored.open||{},drawStep:null,search:'',modal:null,annotations:stored.annotations||[],revisions:stored.revisions||[],printScope:'guide',printMode:'annotated',printAuthors:true};
let lastSelection=null, activeStroke=null;
const user=()=>USERS.find(x=>x.id===state.profile)||USERS[0];
const manager=()=>user().role==='admin';
const guide=()=>data.guides.find(x=>x.id===state.guide);
const guideById=id=>data.guides.find(x=>x.id===id);

function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({guides:data.guides,annotations:state.annotations,profile:state.profile,mode:state.mode,color:state.color,open:state.open,revisions:state.revisions}))}catch{}}
function notify(msg){$('#toast-root').innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;setTimeout(()=>$('#toast-root').innerHTML='',3200)}
function dateFmt(date){return new Date(date).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function openKey(g,s){return `${g}::${s}`}
function isOpen(g,s){let key=openKey(g.id,s.id);return Object.prototype.hasOwnProperty.call(state.open,key)?state.open[key]:s.opening!=='closed'}
function go(view,id){state.view=view;state.drawStep=null;lastSelection=null;if(view==='reader')state.guide=id;if(view==='chapter')state.chapter=id;render();scrollTo({top:0,behavior:'instant'})}
function markText(gid,step,annotated=true){let raw=step.text||'',annotations=annotated?state.annotations.filter(a=>a.guideId===gid&&a.stepId===step.id&&['highlight','strike'].includes(a.type)&&a.start>=0&&a.end<=raw.length):[];
 let cuts=new Set([0,raw.length]);annotations.forEach(a=>{cuts.add(a.start);cuts.add(a.end)});let a=[...cuts].sort((x,y)=>x-y);let result='';for(let i=0;i<a.length-1;i++){let st=a[i],end=a[i+1];let piece=esc(raw.slice(st,end));let spans=annotations.filter(m=>m.start<=st&&m.end>=end);let col=[...spans].reverse().find(m=>m.type==='highlight');if(col)piece=`<mark style="background:${attr(col.color)}">${piece}</mark>`;if(spans.some(m=>m.type==='strike'))piece=`<s>${piece}</s>`;result+=piece;}return result||'&nbsp;';}
function strokePath(a){let arr=a.points||[];if(!arr.length)return '';return arr.map((p,i)=>`${i?'L':'M'} ${(p.x*1000).toFixed(2)} ${(p.y*1000).toFixed(2)}`).join(' ')}
function svgStrokes(gid,stepid){let rows=state.annotations.filter(a=>a.guideId===gid&&a.stepId===stepid&&a.type==='scribble');return `<svg class="print-path" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">${rows.map(a=>`<path d="${strokePath(a)}" fill="none" stroke="${attr(a.color)}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`).join('')}</svg>`}
function sidebar(){return `<aside class="sidebar"><div class="logo">The Playbook<small>Global Wireless · Cinnaminson</small></div><div class="sidebar-label">Notebook</div><button class="side-link ${state.view==='home'?'active':''}" data-nav="home"><span class="side-ico">⌂</span> Home</button><button class="side-link ${state.view==='resources'?'active':''}" data-nav="resources"><span class="side-ico">↗</span> Resources & Jargon</button><div class="sidebar-label">Chapters</div>${data.chapters.filter(c=>c.id!=='resources').map((c,i)=>`<button class="side-link ${state.view==='chapter'&&state.chapter===c.id?'active':''}" data-chapter="${c.id}"><span class="side-ico">${esc(c.icon)}</span> ${esc(c.title)}</button>`).join('')}<div class="side-bottom">Typed official procedures.<br>Shared annotation layer in the connected version.<br><strong>Local demo: edits stay on this device.</strong></div></aside>`}

function home(){let qs=['new-line','add-line','upgrade','aia-c','sim','billpay'];let display=state.search.trim().toLowerCase();let matches=data.guides.filter(g=>(g.title+' '+g.summary+' '+g.steps.map(x=>x.text).join(' ')).toLowerCase().includes(display));return `<div class="paper"><div class="eyebrow">Field Edition · October 2026</div><h1 class="hero-title">Your everyday<br>store notebook.</h1><p class="lede">Official instructions, useful team notes, and the answer you need while a customer is standing in front of you.</p><label class="searchwrap"><span>⌕</span><input id="home-search" value="${attr(state.search)}" placeholder="Search procedures, steps, terms…" aria-label="Search playbook"></label>${display?`<div class="section-title">Search results <small style="font:12px sans-serif;color:#777">(${matches.length})</small></div><div class="chapter-guides">${matches.map(g=>guideCard(g)).join('')||'<div class="empty">No matching guides.</div>'}</div>`:`<div class="section-kicker" style="margin:26px 0 10px">Quick access</div><div class="quickgrid">${qs.map((id,i)=>{let g=guideById(id);return `<button class="quick" data-guide="${id}"><span class="qicon">${['▣','✚','↻','◈','▱','$'][i]}</span><strong>${esc(g.title.replace(' — Phone',''))}</strong></button>`}).join('')}</div><h2 class="section-title">Browse the notebook</h2>${data.chapters.map((c,i)=>`<button class="chapter-row" data-${c.id==='resources'?'nav="resources"':`chapter="${c.id}"`}><span class="chapter-n">${String(i+1).padStart(2,'0')}</span><span class="chapter-name"><strong>${esc(c.title)}</strong><small>${esc(c.tag)}</small></span><span class="chapter-count">${data.guides.filter(g=>g.chapter===c.id).length||'•'} ↗</span></button>`).join('')}`}</div>`}
function guideCard(g){return `<button class="guide-card" data-guide="${attr(g.id)}"><strong>${esc(g.title)}</strong><small>${esc(g.summary)}</small><span class="tag ${g.status==='pending'?'pending':'good'}">${g.status==='pending'?'Pending':'Reviewed draft'}</span></button>`}
function chapterView(){let c=chapterById(state.chapter);let guides=data.guides.filter(g=>g.chapter===c.id);return `<div class="paper"><button class="mini-link" data-nav="home">← Notebook</button><div class="eyebrow" style="margin-top:12px">Chapter ${String(data.chapters.indexOf(c)+1).padStart(2,'0')}</div><h1 class="hero-title">${esc(c.title)}</h1><p class="lede">${esc(c.tag)} · ${guides.length} guide${guides.length!==1?'s':''}</p><div class="notice">Sections marked <strong>Pending</strong> are placeholders—not verified instructions. We’ll fill them as each workflow is confirmed.</div><div class="chapter-guides">${guides.map(guideCard).join('')}</div></div>`}
function stepView(g,s,i){let gid=g.id,sid=s.id,notes=state.annotations.filter(a=>a.guideId===gid&&a.stepId===sid&&a.type==='note');let open=isOpen(g,s);return `<div class="step" id="step-${i}"><button class="step-head" data-toggle="${attr(sid)}" aria-expanded="${open}"><span class="step-idx">${String(i+1).padStart(2,'0')}</span><span class="step-name">${esc(s.title)}</span>${s.opening==='open'?'<span class="pin" title="Open by default">◆</span>':''}<span class="arrow">${open?'⌃':'⌄'}</span></button>${open?`<div class="step-open"><div class="step-copy-frame" id="frame-${attr(sid)}"><div class="step-copy" id="copy-${attr(sid)}" data-stepid="${attr(sid)}">${markText(gid,s,state.mode==='notebook')}</div>${state.mode==='notebook'?`<canvas class="scribble ${state.drawStep===sid?'drawing':''}" data-canvas="${attr(sid)}"></canvas>`:''}</div>${state.mode==='notebook'?`${notes.length?`<div class="note-list">${notes.map(n=>`<div class="note" style="border-left-color:${attr(n.color)}"><div class="who"><span>${esc(n.authorName)} · ${dateFmt(n.createdAt)}</span>${n.authorId===user().id||manager()?`<button class="mini-link" data-delete="${attr(n.id)}" title="Remove note">Remove</button>`:''}</div><p>${esc(n.text)}</p></div>`).join('')}</div>`:''}<div class="markbar"><button class="ink-action" data-add-note="${attr(sid)}">＋ Typed note</button><span style="font-size:10px;color:#778">Ink:</span>${COLORS.map(color=>`<button title="${attr(color)}" class="ink-chip ${state.color===color?'sel':''}" style="background:${color}" data-color="${attr(color)}"></button>`).join('')}<button class="ink-action" data-annotate="highlight" data-step="${attr(sid)}">Highlight</button><button class="ink-action" data-annotate="strike" data-step="${attr(sid)}">Cross out</button><button class="ink-action ${state.drawStep===sid?'active':''}" data-draw="${attr(sid)}">✎ Scribble</button></div><div class="muted" style="margin-top:8px">Select words above first to highlight or strike. Use Scribble to draw directly over the paragraph.</div>`:`<div class="muted" style="margin-top:11px">${notes.length} team note${notes.length!==1?'s':''} hidden in Clean mode</div>`}${manager()?`<div style="display:flex;justify-content:flex-end;margin-top:6px"><button class="mini-link" data-edit-step="${attr(sid)}">Edit official step · demo</button></div>`:''}</div>`:''}</div>`}
function readerView(){let g=guide();let chap=chapterById(g.chapter);return `<div class="paper"><button class="mini-link" data-chapter="${attr(g.chapter)}">← ${esc(chap.title)}</button><div class="reader-top" style="margin-top:14px"><div><div class="eyebrow">${esc(chap.title)} / Procedure</div><h1 class="hero-title">${esc(g.title)}</h1></div></div><div class="reader-meta"><span class="tag ${g.status==='pending'?'pending':'good'}">${g.status==='pending'?'Pending':'Reviewed draft'}</span><span class="tag">${g.steps.length} sections</span><span class="tag">${esc(g.revision||'Draft')}</span></div><p class="lede">${esc(g.summary)}</p>${g.status==='pending'?'<div class="notice"><strong>Workflow pending:</strong> this is a placeholder, not an approved step-by-step process.</div>':''}${manager()?`<div class="manager-box"><strong>Manager preview</strong><span class="muted">Local editing only</span><button class="pill slim" data-action="add-step">＋ Add step</button><button class="pill slim" data-action="set-status">Change status</button></div>`:''}<div class="reading-controls"><div class="seg" role="group" aria-label="Reading mode"><button class="${state.mode==='clean'?'sel':''}" data-mode="clean">☷ Clean</button><button class="${state.mode==='notebook'?'sel':''}" data-mode="notebook">✎ Notebook</button></div><div><button class="mini-link" data-action="expand">Expand All</button><span style="color:#bbb">·</span><button class="mini-link" data-action="collapse">Collapse All</button></div></div><div class="steps">${g.steps.map((s,i)=>stepView(g,s,i)).join('')}</div><div class="divider"></div><div class="rule-alert">Official text is separate from team markup. Reps can annotate it without changing the underlying instructions.</div><div class="muted">${esc(g.title)} · Cinnaminson working draft · Check CCKM for current eligibility, policies and promotional terms.</div></div>`}
function resourcesView(){let groups=[...new Set(data.resources.map(x=>x.category))];return `<div class="paper"><div class="eyebrow">Quick references</div><h1 class="hero-title">Tools, numbers<br>& jargon.</h1><p class="lede">One place for the links and terminology Cinnaminson uses every day.</p><div class="notice"><strong>Store-specific:</strong> This edition is for Cinnaminson only. Internal systems may require an AT&T sign-in.</div>${groups.map(cat=>`<h2 class="section-title">${esc(cat)}</h2><div class="resource-groups">${data.resources.filter(r=>r.category===cat).map(r=>`<div class="resource-card"><strong>${esc(r.name)}</strong><small>${esc(r.detail)}</small><span class="res-val">${esc(r.value)}</span><div class="actions">${r.url?`<a class="pill slim primary" href="${attr(r.url)}" target="${r.url.startsWith('tel:')?'_self':'_blank'}" rel="noopener">${r.url.startsWith('tel:')?'☎ Call':'↗ Open'}</a>`:''}<button class="pill slim" data-copy="${attr(r.value)}">Copy</button></div></div>`).join('')}</div>`).join('')}<h2 class="section-title" id="glossary">Jargon & Acronyms</h2><p class="lede" style="font-size:13px">Alphabetical reference · 39+ terms · RCO and Study Guide are excluded.</p><div class="gloss">${Object.entries(data.glossary).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>`<div class="gloss-item"><strong>${esc(k)}</strong>${esc(v)}</div>`).join('')}</div></div>`}
function render(){let body=state.view==='home'?home():state.view==='chapter'?chapterView():state.view==='resources'?resourcesView():readerView();$('#app').innerHTML=`<div class="app-shell">${sidebar()}<main class="main"><div class="workspace">${topbar()}${demoStrip()}${body}<div class="footer">THE PLAYBOOK · CINNAMINSON · WORKING PREVIEW<br>Official updates require manager approval. This file is not yet connected to Supabase.</div></div></main></div>${mobilebar()}`;renderModal();initCanvases()}
function renderModal(){let m=state.modal;if(!m){$('#modal-root').innerHTML='';return;}let content='';if(m.type==='profile'){content=`<h2>Choose demo profile</h2><p>Switch identities to preview manager and rep permissions. Real account login is part of the Supabase-connected build.</p>${USERS.map(p=>`<label class="radio-line"><input type="radio" name="demo-profile" value="${p.id}" ${p.id===state.profile?'checked':''}> ${esc(p.name)} ${p.role==='admin'?'· Manager':'· Rep'}</label>`).join('')}<div class="modal-row"><button class="pill primary" data-action="save-profile">Use profile</button></div>`}
else if(m.type==='note'){content=`<h2>New team note</h2><p>${esc(guideById(m.guideId)?.title)} → ${esc(guideById(m.guideId)?.steps.find(x=>x.id===m.stepId)?.title)}</p><label for="note-input">Typed note</label><textarea id="note-input" placeholder="A useful tip, correction, or something to watch for…"></textarea><div class="modal-row"><button class="pill" data-action="close-modal">Cancel</button><button class="pill primary" data-action="save-note">Post note</button></div>`}
else if(m.type==='edit'){content=`<h2>Edit official step</h2><p>Manager-only action in the final connected app. This preview saves the change locally and records a revision.</p><label>Step title</label><input id="edit-title" value="${attr(m.step.title)}"><label>Instructions</label><textarea id="edit-text" style="min-height:210px">${esc(m.step.text)}</textarea><label>Default expansion</label><select id="edit-opening"><option value="open" ${m.step.opening==='open'?'selected':''}>Open by default</option><option value="closed" ${m.step.opening==='closed'?'selected':''}>Collapsed by default</option></select><div class="modal-row"><button class="pill" data-action="close-modal">Cancel</button><button class="pill primary" data-action="save-step">Save preview edit</button></div>`}
else if(m.type==='add-step'){content=`<h2>Add a procedure step</h2><label>Step title</label><input id="edit-title" placeholder="e.g., Account Verification"><label>Instructions</label><textarea id="edit-text"></textarea><div class="modal-row"><button class="pill" data-action="close-modal">Cancel</button><button class="pill primary" data-action="save-added-step">Add step</button></div>`}
else if(m.type==='status'){content=`<h2>Set draft status</h2><p>In this preview, status is a local editorial label—not a live approval.</p><select id="status-field"><option value="approved" ${guide().status==='approved'?'selected':''}>Reviewed draft</option><option value="pending" ${guide().status==='pending'?'selected':''}>Pending</option></select><div class="modal-row"><button class="pill" data-action="close-modal">Cancel</button><button class="pill primary" data-action="save-status">Save status</button></div>`}
else if(m.type==='print'){content=`<h2>Print / Save as PDF</h2><p>Creates a print-formatted document—not a screenshot. Your browser's Print option can save it as a PDF.</p><label>Include</label>${[['guide','Current procedure'],['chapter','Entire chapter'],['book','Whole Playbook']].map(([v,label])=>`<label class="radio-line"><input type="radio" name="print-scope" value="${v}" ${state.printScope===v?'checked':''}> ${label}</label>`).join('')}<label>Appearance</label>${[['annotated','Notebook — include team notes and marks'],['clean','Clean — official instructions only']].map(([v,label])=>`<label class="radio-line"><input type="radio" name="print-mode" value="${v}" ${state.printMode===v?'checked':''}> ${label}</label>`).join('')}<label class="radio-line"><input type="checkbox" id="print-authors" ${state.printAuthors?'checked':''}> Show note authors and dates</label><div class="modal-row"><button class="pill" data-action="close-modal">Cancel</button><button class="pill primary" data-action="do-print">Open print dialog</button></div>`}
else if(m.type==='info'){content=`<h2>About this preview</h2><p><strong>Working now:</strong> mobile layout, navigation, expandable sections, search, clean/notebook, typed notes, colored selection highlights, cross-outs, scribble strokes, manager editing and print-to-PDF.</p><p><strong>Not connected yet:</strong> rep logins, shared live syncing, row-level permissions, Supabase revisions, hosted URL. This preview only saves changes to this browser.</p><div class="modal-row"><button class="pill primary" data-action="close-modal">Understood</button></div>`}
$('#modal-root').innerHTML=`<div class="modal-shade" data-backdrop="1"><div class="modal" role="dialog" aria-modal="true">${content}</div></div>`;}
function modal(type,extra={}){state.modal={type,...extra};renderModal()}
function closeModal(){state.modal=null;renderModal()}
function getStep(gid,sid){return guideById(gid)?.steps.find(x=>x.id===sid)}
function addAnnotation(annotation){state.annotations.push({id:'a-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),authorId:user().id,authorName:user().name,color:state.color,createdAt:new Date().toISOString(),...annotation});persist();render()}
function captureSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed||sel.rangeCount===0)return;let range=sel.getRangeAt(0);let el=range.commonAncestorContainer.nodeType===1?range.commonAncestorContainer:range.commonAncestorContainer.parentElement;let root=el?.closest('.step-copy');if(!root||!root.contains(range.startContainer)||!root.contains(range.endContainer))return;let count=0,start=null,end=null;let walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walk.nextNode()){if(n===range.startContainer)start=count+range.startOffset;if(n===range.endContainer)end=count+range.endOffset;count+=n.nodeValue.length;}if(start!=null&&end!=null&&end>start)lastSelection={guideId:state.guide,stepId:root.dataset.stepid,start,end}}
function initCanvases(){document.querySelectorAll('canvas[data-canvas]').forEach(c=>{let id=c.dataset.canvas,frame=c.parentElement,rect=frame.getBoundingClientRect(),ratio=devicePixelRatio||1;c.width=Math.max(1,Math.round(rect.width*ratio));c.height=Math.max(1,Math.round(rect.height*ratio));let ctx=c.getContext('2d');ctx.scale(ratio,ratio);ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';for(let a of state.annotations.filter(x=>x.guideId===state.guide&&x.stepId===id&&x.type==='scribble')){ctx.beginPath();(a.points||[]).forEach((p,i)=>{let x=p.x*rect.width,y=p.y*rect.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=a.color;ctx.stroke()}if(state.drawStep===id){c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);let r=c.getBoundingClientRect();activeStroke={guideId:state.guide,stepId:id,type:'scribble',points:[],color:state.color};activeStroke.points.push({x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height});};c.onpointermove=e=>{if(!activeStroke)return;let r=c.getBoundingClientRect(),p={x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))};activeStroke.points.push(p);ctx.strokeStyle=activeStroke.color;ctx.beginPath();let q=activeStroke.points.at(-2);ctx.moveTo(q.x*r.width,q.y*r.height);ctx.lineTo(p.x*r.width,p.y*r.height);ctx.stroke()};c.onpointerup=()=>{if(activeStroke&&activeStroke.points.length>1){let stroke=activeStroke;activeStroke=null;addAnnotation(stroke);state.drawStep=id;render()}else activeStroke=null}}})}
function renderPrintView(){let current=guide();let all=state.printScope==='book'?data.guides:state.printScope==='chapter'?data.guides.filter(g=>g.chapter===current.chapter):[current];let annotated=state.printMode==='annotated';let markup=`<header class="print-front"><div class="print-meta">GLOBAL WIRELESS · CINNAMINSON · THE PLAYBOOK</div><h1>${state.printScope==='book'?'Complete Playbook':state.printScope==='chapter'?chapterById(current.chapter).title:current.title}</h1><div class="print-meta">${annotated?'Notebook (with team annotations)':'Clean (official text only)'} · Exported ${new Date().toLocaleDateString()} · Working preview, not published</div></header>`;
 for(let g of all){markup+=`<section class="print-guide"><h2>${esc(g.title)}</h2><div class="print-sub">${esc(chapterById(g.chapter).title)} · ${g.status==='pending'?'PENDING — NOT VERIFIED':'Reviewed draft'} · ${esc(g.revision)}</div><p>${esc(g.summary)}</p>`;g.steps.forEach((s,i)=>{markup+=`<div class="print-section"><h3>${String(i+1).padStart(2,'0')} · ${esc(s.title)}</h3><div class="print-copy-frame"><div class="print-copy">${markText(g.id,s,annotated)}</div>${annotated?svgStrokes(g.id,s.id):''}</div>${annotated?state.annotations.filter(n=>n.guideId===g.id&&n.stepId===s.id&&n.type==='note').map(n=>`<div class="print-note">${esc(n.text)}${state.printAuthors?`<small>${esc(n.authorName)} · ${dateFmt(n.createdAt)}</small>`:''}</div>`).join(''):''}</div>`});markup+='</section>'}markup+='<footer class="print-foot">Cinnaminson working preview · Confirm current policy in CCKM before customer transactions.</footer>';$('#print-root').innerHTML=markup;}
document.addEventListener('selectionchange',()=>{if(state.view==='reader')captureSelection()});
document.addEventListener('click',e=>{if(e.target.dataset.backdrop){closeModal();return}let b=e.target.closest('[data-action],[data-nav],[data-chapter],[data-guide],[data-toggle],[data-mode],[data-add-note],[data-color],[data-annotate],[data-draw],[data-edit-step],[data-delete],[data-copy]');if(!b)return;
 if(b.dataset.nav){go(b.dataset.nav);return}if(b.dataset.chapter){go('chapter',b.dataset.chapter);return}if(b.dataset.guide){go('reader',b.dataset.guide);return}if(b.dataset.toggle){let g=guide(),s=g.steps.find(x=>x.id===b.dataset.toggle);state.open[openKey(g.id,s.id)]=!isOpen(g,s);persist();render();return}if(b.dataset.mode){state.mode=b.dataset.mode;state.drawStep=null;persist();render();return}if(b.dataset.color){state.color=b.dataset.color;persist();render();return}if(b.dataset.addNote){modal('note',{guideId:state.guide,stepId:b.dataset.addNote});return}if(b.dataset.draw){state.drawStep=state.drawStep===b.dataset.draw?null:b.dataset.draw;render();return}if(b.dataset.annotate){let sid=b.dataset.step;captureSelection();if(!lastSelection||lastSelection.guideId!==state.guide||lastSelection.stepId!==sid){notify('First select the words in this step, then tap Highlight or Cross out.');return}let a={guideId:state.guide,stepId:sid,type:b.dataset.annotate,start:lastSelection.start,end:lastSelection.end};lastSelection=null;window.getSelection()?.removeAllRanges();addAnnotation(a);notify(b.dataset.annotate==='strike'?'Cross-out saved in demo':'Highlight saved in demo');return}if(b.dataset.editStep){if(!manager()){notify('Manager only');return}let s=getStep(state.guide,b.dataset.editStep);modal('edit',{step:structuredClone(s),stepId:s.id,guideId:state.guide});return}if(b.dataset.delete){let a=state.annotations.find(x=>x.id===b.dataset.delete);if(a&&(manager()||a.authorId===user().id)){state.annotations=state.annotations.filter(x=>x.id!==a.id);persist();render();notify('Note removed')}return}if(b.dataset.copy){navigator.clipboard?.writeText(b.dataset.copy).then(()=>notify('Copied to clipboard')).catch(()=>notify('Copy unavailable here'));return}
 switch(b.dataset.action){case'profile':modal('profile');break;case'demo-info':modal('info');break;case'print':modal('print');break;case'expand':guide().steps.forEach(s=>state.open[openKey(state.guide,s.id)]=true);persist();render();break;case'collapse':guide().steps.forEach(s=>state.open[openKey(state.guide,s.id)]=false);persist();render();break;case'add-step':modal('add-step');break;case'set-status':modal('status');break;case'close-modal':closeModal();break;
 case'save-profile':{let chosen=document.querySelector('[name="demo-profile"]:checked')?.value;state.profile=chosen||state.profile;persist();closeModal();render();notify('Viewing as '+user().name+' (demo only)');break}
 case'save-note':{let text=$('#note-input').value.trim();if(!text){notify('Type a note first');break}addAnnotation({guideId:state.modal.guideId,stepId:state.modal.stepId,type:'note',text});closeModal();notify('Note saved locally');break}
 case'save-step':{if(!manager())break;let m=state.modal,s=getStep(m.guideId,m.stepId),title=$('#edit-title').value.trim(),text=$('#edit-text').value.trim();if(!title||!text){notify('Title and instructions required');break}state.revisions.push({guideId:m.guideId,stepId:s.id,before:structuredClone(s),by:user().name,time:new Date().toISOString()});s.title=title;s.text=text;s.opening=$('#edit-opening').value;guideById(m.guideId).revision='Edited locally';persist();closeModal();render();notify('Official step changed in local preview');break}
 case'save-added-step':{if(!manager())break;let title=$('#edit-title').value.trim(),text=$('#edit-text').value.trim();if(!title||!text){notify('Title and instructions required');break}let sid='custom-'+Date.now();guide().steps.push({id:sid,title,text,opening:'closed'});persist();closeModal();render();notify('Step added locally');break}
 case'save-status':{if(!manager())break;guide().status=$('#status-field').value;persist();closeModal();render();notify('Status updated locally');break}
 case'do-print':{state.printScope=document.querySelector('[name="print-scope"]:checked')?.value||'guide';state.printMode=document.querySelector('[name="print-mode"]:checked')?.value||'annotated';state.printAuthors=!!$('#print-authors')?.checked;closeModal();renderPrintView();setTimeout(()=>window.print(),120);break}
 }
});
document.addEventListener('input',e=>{if(e.target.id==='home-search'){let value=e.target.value,ss=e.target.selectionStart;state.search=value;render();let el=$('#home-search');el?.focus();el?.setSelectionRange(ss,ss)}});
window.addEventListener('afterprint',()=>{$('#print-root').innerHTML='' });
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal()});
render();
</script></body></html>
