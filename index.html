ideSteps(ui.guide).find(x=>x.slug===b.dataset.edit);showModal('edit',{step:s});return}if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);notify('Copied')}catch{notify('Copy unavailable')}}if(b.dataset.approve){if(!admin())return;let r=await sb.from('pb_profiles').update({role:'rep'}).eq('id',b.dataset.approve);if(r.error)msgError(r.error);else{notify('Rep approved');await loadPending()}return}
const a=b.dataset.action;if(!a)return;if(a==='close'){closeModal();return}if(a==='account'||a==='members'){showModal(a);return}if(a==='print'||a==='status'||a==='new-step'){if(a==='status'||a==='new-step'){if(!admin())return}showModal(a);return}if(a==='expand'||a==='collapse'){for(let s of guideSteps(ui.guide))ui.open[openKey(ui.guide,s.slug)]=a==='expand';savePrefs();render();return}if(a==='save-note'){let text=$('#modal-text')?.value.trim(),step=modal.step;if(!text){notify('Type a note first');return}closeModal();await saveAnnotation({kind:'note',step,text});return}if(a==='save-official'){await saveOfficial();return}if(a==='save-status'){if(!admin())return;let status=$('#modal-status')?.value,r=await sb.from('pb_guides').update({status,updated_at:new Date().toISOString()}).eq('id',ui.guide);if(r.error)msgError(r.error);else{await sb.from('pb_revisions').insert({guide_id:ui.guide,actor_id:me.id,action:'set_status',next_value:{status}});closeModal();await loadData()}return}if(a==='do-print'){ui.printScope=document.querySelector('input[name="print-scope"]:checked')?.value||'guide';ui.printStyle=document.querySelector('input[name="print-style"]:checked')?.value||'notebook';ui.printAuthors=!!$('#print-authors')?.checked;closeModal();buildPrint();setTimeout(()=>window.print(),100);return}});
document.addEventListener('input',e=>{if(e.target.id==='search'){ui.query=e.target.value;let pos=e.target.selectionStart;render();let newSearch=$('#search');newSearch?.focus();newSearch?.setSelectionRange(pos,pos)}});

(function startPlaybook(){
 const start=document.getElementById('startup-message');
 const lib=document.createElement('script');
 lib.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js';
 lib.async=true;
 let finished=false;
 const fail=message=>{if(finished)return;finished=true;if(start)start.textContent=message+' Please refresh or ask your manager for help.';};
 const watchdog=setTimeout(()=>fail('The login service took too long to load.'),12000);
 lib.onload=()=>{if(finished)return;clearTimeout(watchdog);finished=true;
  if(!window.supabase?.createClient){if(start)start.textContent='The login library could not start. Please refresh.';return;}
  try{sb=window.supabase.createClient(SUPABASE_URL,PUBLIC_KEY);void boot();}
  catch(e){if(start)start.textContent='The Playbook could not start: '+e.message;}
 };
 lib.onerror=()=>{clearTimeout(watchdog);fail('The login library could not be downloaded.')};
 document.head.appendChild(lib);
})();
</script></body></html>
