/* Playbook v4 — comfortable reading, numbered instructions, touch-friendly markup */
.paper.reading-paper{background-image:linear-gradient(90deg,transparent 0,transparent 47px,rgba(201,78,75,.22) 48px,transparent 49px);padding-bottom:118px}
.reading-paper .step{background:#fffdf8;border-color:#d9d2c4;border-radius:11px}
.reading-paper .step-head{min-height:60px;padding:16px 17px}
.reading-paper .step-name{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.35;font-weight:750;letter-spacing:-.15px}
.reading-paper .step-idx{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;font-weight:750}
.reading-paper .step-open{padding:4px 20px 15px 60px}
.reading-paper .step-copy{font:400 16px/1.68 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0;white-space:normal;color:#26333c;overflow-wrap:break-word}
.reading-paper .step-copy-frame{margin:12px 0 8px}
.instruction-list{display:flex;flex-direction:column;gap:10px;position:relative}
.instruction-item{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:7px;align-items:start;break-inside:avoid;min-height:20px}
.instruction-label{font-weight:800;color:#99634e;font-size:.89em;padding-top:1px;font-variant-numeric:tabular-nums}
.instruction-text{overflow-wrap:anywhere}
.instruction-item.is-nested{margin-left:26px;grid-template-columns:34px minmax(0,1fr);padding-left:12px;border-left:2px solid #e7ddc9}
.instruction-item.is-nested .instruction-label{font-size:.83em;color:#5b7385}
.editor-hint{font-size:13px;line-height:1.6;color:#536b77;background:#e8f0f3;border-radius:8px;padding:12px;margin:10px 0}
.official-editor{min-height:260px!important;font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;white-space:pre-wrap}
.step-utilities{display:flex;flex-wrap:wrap;gap:10px;border-top:1px dashed #e3dbcd;padding-top:8px;margin-top:16px}
.admin-edit{text-align:right;margin-top:8px}
.markup-dock{position:fixed;z-index:15;bottom:20px;left:calc(50% + 135px);transform:translateX(-50%);display:flex;align-items:center;flex-wrap:wrap;gap:13px;border-radius:16px;border:1px solid #c6ced0;background:#fffef9;box-shadow:0 12px 45px #182f3b33;padding:9px 12px;max-width:min(92vw,730px)}
.tool-row,.tool-colors{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tool-choice{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#385266;background:#f5f4f0;border:1px solid transparent;border-radius:9px;padding:10px 11px;min-height:39px}
.tool-choice.chosen{color:#fff;background:#25475c;box-shadow:0 2px 5px #182f3b22}
.tool-colors{border-left:1px solid #ddd8c9;padding-left:11px;gap:10px}
.tool-colors span{font-size:10px;font-weight:800;letter-spacing:.09em;color:#6e7979}
.tool-colors .ink-chip{width:26px;height:26px}
.scribble.drawing{touch-action:none;cursor:crosshair}
.reading-paper .rule-alert{margin-top:18px}
@media(max-width:900px){.markup-dock{left:50%;bottom:80px;max-width:calc(100vw - 20px)}.reading-paper .step-open{padding-left:15px;padding-right:15px}}
@media(max-width:600px){.reading-paper .step-copy{font-size:16px;line-height:1.64}.markup-dock{width:calc(100vw - 22px);justify-content:center;gap:7px;padding:9px}.tool-row{justify-content:center}.tool-choice{font-size:11px;padding:9px 8px}.tool-colors{border:0;padding-left:0;justify-content:center;gap:9px}.tool-colors .ink-chip{width:22px;height:22px}.instruction-item.is-nested{margin-left:15px;padding-left:8px}.reading-paper .step-head{min-height:55px}.reading-paper .step-name{font-size:15px}}
@media print{.print-copy{font:11pt/1.6 Arial,sans-serif;white-space:normal}.print-copy .instruction-list{gap:7px}.print-copy .instruction-label{color:#333}.print-copy .instruction-item.is-nested{margin-left:19px}.markup-dock{display:none!important}}

/* One-session preparation checklist: no customer information or saved checkmarks. */
.prep-checklist-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 17px;padding:12px;border:1px solid #d9d0be;background:#f4f0e6;border-radius:10px}
.prep-mst-link{font-weight:800;font-size:13px;background:#193b61;color:#fff;padding:10px 13px;border-radius:7px;display:inline-flex;align-items:center;text-decoration:none}
.prep-mst-link:hover{color:#fff;background:#2e577c;text-decoration:none}
.prep-checklist-head span{font-size:11px;color:#627073;flex:1;min-width:100px}
.prep-check-row{display:grid;grid-template-columns:29px 28px minmax(0,1fr);gap:6px;align-items:start;border:1px solid transparent;border-radius:9px;padding:11px 7px;cursor:pointer;min-height:44px}
.prep-check-row:hover{background:rgba(42,74,99,.055)}
.prep-check{appearance:auto;accent-color:#193b61;width:20px;height:20px;margin:0 0 0 3px;cursor:pointer;touch-action:manipulation}
.prep-check-row:has(.prep-check:checked){background:rgba(86,139,102,.08)}
.prep-check-row:has(.prep-check:checked) .instruction-text{color:#687875}
.prep-list .instruction-item.is-nested{margin-left:54px}
.tool-colors .ink-chip.core-ink{width:29px;height:29px}
.tool-colors .ink-chip.core-ink.sel{box-shadow:0 0 0 3px #fff,0 0 0 5px #193b61}
@media(max-width:600px){.prep-checklist-head{gap:7px}.prep-checklist-head span{flex-basis:100%}.prep-check-row{grid-template-columns:27px 25px minmax(0,1fr);padding:10px 2px}.prep-list .instruction-item.is-nested{margin-left:31px}.tool-colors .ink-chip.core-ink{width:25px;height:25px}}
@media print{.prep-checklist-head .mini-link{display:none!important}.prep-check{appearance:none;border:1px solid #777;width:12px;height:12px}}

/* ── The Playbook · Transaction-first notebook shell ─────────────────────── */

function instructionItems(body){
 const src=String(body||'');
 const manual=src.split(/\r?\n/).some(line=>/^\s*[a-z]{1,2}[.)]\s+\S/i.test(line));
 let spans=[];
 if(manual){for(const m of src.matchAll(/[^\r\n]+/g))spans.push({text:m[0],start:m.index})}
 else {for(const m of src.matchAll(/[^;\r\n]+/g)){
  const text=m[0];let offset=0;
  // Prose is split at sentences; do not alter the source string or the database.
  for(const segment of text.split(/(?<=[.!?])\s+(?=[A-Z])/g)){
   const at=text.indexOf(segment,offset);
   spans.push({text:segment,start:m.index+at});offset=at+segment.length;
  }
 }}
 let roots=0,items=[];
 for(let entry of spans){let raw=entry.text,leading=(raw.match(/^\s*/)||[''])[0].length;
  let content=raw.slice(leading).trimEnd(),at=entry.start+leading;
  if(!content)continue;
  let labelMatch=content.match(/^([a-z]{1,2})[.)]\s+/i);
  let label;if(labelMatch){label=labelMatch[1].toLowerCase();content=content.slice(labelMatch[0].length);at+=labelMatch[0].length;
   if(label.length===1)roots=Math.max(roots,label.charCodeAt(0)-96);
  }else{roots++;label=String.fromCharCode(96+Math.min(roots,26));}
  if(!content.trim())continue;
  items.push({label,nested:label.length===2,text:content,start:at,end:at+content.length});
 }
 return items;
}
function annotatedFragment(g,s,start,end,show){
 const body=s.body||'',raw=body.slice(start,end);
 if(!show)return linkify(raw);
 const layers=ann(g,s.slug).filter(a=>['highlight','strike'].includes(a.kind)&&Number.isInteger(a.start_offset)&&Number.isInteger(a.end_offset)&&a.end_offset>start&&a.start_offset<end);
 const cuts=[start,end,...layers.flatMap(a=>[Math.max(start,a.start_offset),Math.min(end,a.end_offset)])].sort((a,b)=>a-b).filter((v,i,arr)=>i===0||v!==arr[i-1]);
 let html='';for(let i=1;i<cuts.length;i++){let a=cuts[i-1],b=cuts[i],part=linkify(body.slice(a,b)),active=layers.filter(x=>x.start_offset<=a&&x.end_offset>=b),high=active.filter(x=>x.kind==='highlight').at(-1);
  if(high)part='<mark style="background:'+esc(high.color)+'">'+part+'</mark>';
  if(active.some(x=>x.kind==='strike'))part='<s>'+part+'</s>';
  html+=part;
 }return html;
}

}

function rememberSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return;let range=sel.getRangeAt(0),parent=range.commonAncestorContainer.nodeType===1?range.commonAncestorContainer:range.commonAncestorContainer.parentElement,root=parent?.closest('.step-copy');if(!root||!root.contains(range.startContainer)||!root.contains(range.endContainer))return;let walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),node,count=0,start=null,end=null;while(node=walker.nextNode()){if(node===range.startContainer)start=count+range.startOffset;if(node===range.endContainer)end=count+range.endOffset;count+=node.nodeValue.length;}if(start!==null&&end!==null&&end>start)selection={step:root.dataset.copyStep,start,end,guide:ui.guide}}

function canvasStroke(ctx,points,rect,kind,color){
 if(!Array.isArray(points)||!points.length)return;
 ctx.save();ctx.strokeStyle=color;ctx.lineWidth=kind==='highlight'?23:3.4;ctx.globalAlpha=kind==='highlight'?.28:1;
 ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach((p,i)=>{
  let x=p.x*rect.width,y=p.y*rect.height;
  i?ctx.lineTo(x,y):ctx.moveTo(x,y);
 });if(points.length===1){const p=points[0];ctx.lineTo(p.x*rect.width+.01,p.y*rect.height+.01)}ctx.stroke();ctx.restore();
}
function nearStroke(points,p,radius,rect){
 if(!Array.isArray(points)||!points.length)return false;
 const px=p.x*rect.width,py=p.y*rect.height;
 const gap=(a,b)=>Math.hypot(a.x*rect.width-px,a.y*rect.height-py);
 for(let i=0;i<points.length;i++){
  if(gap(points[i])<=radius)return true;
  if(i===0)continue;
  const a=points[i-1],b=points[i],ax=a.x*rect.width,ay=a.y*rect.height,bx=b.x*rect.width,by=b.y*rect.height,
        dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));
  if(Math.hypot(px-(ax+t*dx),py-(ay+t*dy))<=radius)return true;
 }return false;
}
function initCanvas(){document.querySelectorAll('canvas[data-canvas]').forEach(c=>{
 const slug=c.dataset.canvas,rect=c.parentElement.getBoundingClientRect(),ratio=window.devicePixelRatio||1;
 if(rect.width<=0||rect.height<=0)return;
 c.width=Math.max(1,Math.round(rect.width*ratio));c.height=Math.max(1,Math.round(rect.height*ratio));
 const ctx=c.getContext('2d');ctx.scale(ratio,ratio);
 const marks=ann(ui.guide,slug).filter(x=>['scribble','highlight'].includes(x.kind)&&Array.isArray(x.strokes));
 marks.forEach(a=>canvasStroke(ctx,a.strokes,rect,a.kind,a.color));
 if(!ui.markup||ui.mode!=='notebook')return;
 let active=null,pointer=null;
 const coords=e=>{let box=c.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-box.left)/box.width)),y:Math.max(0,Math.min(1,(e.clientY-box.top)/box.height))}};
 c.onpointerdown=e=>{
  e.preventDefault();pointer=e.pointerId;c.setPointerCapture(pointer);const p=coords(e);
  if(ui.tool==='eraser'){
   const target=[...marks].reverse().find(x=>(admin()||x.author_id===me.id)&&nearStroke(x.strokes,p,x.kind==='highlight'?20:12,rect));
   if(target){void removeAnnotation(target.id)}else notify('No mark found here');return;
  }
  active=[p];
 };
 c.onpointermove=e=>{
  if(!active||e.pointerId!==pointer)return;
  e.preventDefault();const p=coords(e),last=active.at(-1);active.push(p);
  canvasStroke(ctx,[last,p],rect,ui.tool==='highlight'?'highlight':'scribble',ui.color);
 };
 const finish=e=>{
  if(e.pointerId!==pointer)return;
  const points=active;active=null;pointer=null;
  if(points?.length){if(points.length===1)points.push({...points[0],x:Math.min(1,points[0].x+.0001)});
   void saveAnnotation({step:slug,kind:ui.tool==='highlight'?'highlight':'scribble',points})}
 };
 c.onpointerup=finish;c.onpointercancel=()=>{active=null;pointer=null};
 });}

function txFlowSlug(path,index){return 'walkthrough--'+path+'--'+index}
function txOverride(gid,pid,i,fallback){const saved=data.steps.find(s=>s.guide_id===gid&&s.slug===txFlowSlug(pid,i));if(!saved)return fallback;
 try{const v=JSON.parse(saved.body);if(v.v!==1||!Array.isArray(v.actions))return fallback;return [saved.title,v.actions,v.help||'',!!v.review,v.why||''];}catch{return fallback;}}
function txGuidePaths(id){const existing=TX_EXTRA[id]||TX_GUIDES[id];if(existing)return existing.map(p=>({...p,steps:p.steps.map((x,i)=>txOverride(id,p.id,i,x))}));
 const steps=guideSteps(id).filter(s=>!/^pending.review$/i.test(s.title)).map(s=>({dbStep:s}));
 return [{id:'standard',name:'Step-by-step',caption:'Current reference instructions',steps:steps.length?steps:[['Not yet documented',['This procedure still requires a verified workflow.','Check CCKM / ask management before making account changes.'],'We will add exact screens when available.',true]]}];}
function txPath(){const options=txGuidePaths(ui.guide);return options.find(p=>p.id===tx.path)||options[0];}
function txReset(id){tx.guide=id;tx.path=txGuidePaths(id)[0].id;tx.step=0;tx.help=false;tx.done=false;tx.view='walkthrough';tx.refOrigin=null;tx.checks=new Set();tx.auditChecks=new Set();}
function txSingleStep(x){if(x.dbStep){const entries=instructionItems(x.dbStep.body);
 const actions=entries.map(z=>(z.nested?'↳ ':'')+z.text);
 return {title:x.dbStep.title,actions:actions.length?actions:[x.dbStep.body],help:'',why:'',review:/pending|needs review|awaiting|to confirm/i.test(x.dbStep.title+' '+x.dbStep.body)};}
 return {title:x[0],actions:x[1],help:x[2]||'',review:!!x[3],why:x[4]||''};}
function txCheckId(type,i){return [ui.guide,tx.path,tx.step,type,i].join('|')}
function txAuditSection(){if(!TX_SALE_AUDIT_GUIDES.has(ui.guide)||tx.step!==0)return '';
 return '<details class="tx-audit" open><summary>Before the sale · quick quote check <small>Reminder only — never graded</small></summary><div class="tx-audit-list">'+TX_SALE_AUDIT.map((line,i)=>'<label class="tx-audit-item"><input type="checkbox" data-tx-audit="'+i+'" '+(tx.auditChecks?.has(txCheckId('audit',i))?'checked':'')+'><span>'+esc(line)+'</span></label>').join('')+'</div><p class="tx-audit-foot">For a new account, review the relevant options rather than an existing bill. Continue whenever you are ready.</p></details>';}
function txHome(){const query=ui.query.trim().toLowerCase();let featured=['new-line','add-line','upgrade','billpay','rate-changes','feature-changes','aia-c','df','returns','sim'];let icons={'new-line':'✳','add-line':'＋','upgrade':'↗','billpay':'$','rate-changes':'⇄','feature-changes':'⚙','aia-c':'◈','df':'▤','returns':'↩','sim':'▣','porting':'↔'};

document.addEventListener('change',e=>{
 if(!authed())return;
 if(e.target.matches('[data-tx-check]')){const key=txCheckId('action',e.target.dataset.txCheck);if(e.target.checked)tx.checks.add(key);else tx.checks.delete(key);e.target.closest('.tx-action-row')?.classList.toggle('is-checked',e.target.checked);}
 if(e.target.matches('[data-tx-audit]')){const key=txCheckId('audit',e.target.dataset.txAudit);if(e.target.checked)tx.auditChecks.add(key);else tx.auditChecks.delete(key);}
},true);
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-tx]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();if(!authed())return;
 const op=b.dataset.tx,val=b.dataset.value;
 if(op==='refguide'){navigate('reader',val);tx.view='reference';render();window.scrollTo(0,0);return;}
 if(op==='path'){tx.path=val;tx.step=0;tx.done=false;tx.view='walkthrough';}
 else if(op==='group'){const p=txGuidePaths(ui.guide).find(p=>p.group===val);if(p){tx.path=p.id;tx.step=0;tx.done=false;tx.view='walkthrough';}}
 else if(op==='next'){let len=txPath().steps.length;if(tx.step>=len-1)tx.done=true;else tx.step++;}
 else if(op==='prev')tx.step=Math.max(0,tx.step-1);
 else if(op==='view'){tx.view=val;ui.markup=false;}
 else if(op==='restart')txReset(ui.guide);
 else if(op==='jump')tx.step=Math.max(0,Math.min(txPath().steps.length-1,Number(val)||0));
 else if(op==='edit-step'){if(!admin())return;const step=txSingleStep(txPath().steps[tx.step]);showModal('txedit',{step,path:tx.path,index:tx.step});return;}
 else if(op==='save-tx-step'){if(!admin())return;await saveTxOfficial();return;}
 render();window.scrollTo(0,0);
},true);
async function saveTxOfficial(){
 const title=$('#tx-title')?.value.trim(),actions=String($('#tx-actions')?.value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),help=$('#tx-tip')?.value.trim()||'',why=$('#tx-why')?.value.trim()||'',review=!!$('#tx-unverified')?.checked;
 if(!title||!actions.length){notify('A title and at least one action are required');return;}
 const path=modal.path,index=modal.index,slug=txFlowSlug(path,index),old=data.steps.find(s=>s.guide_id===ui.guide&&s.slug===slug);
 const vals={guide_id:ui.guide,slug,title,body:JSON.stringify({v:1,actions,help,why,review}),display_order:500+index,default_open:false,updated_at:new Date().toISOString()};
 const {error}=await sb.from('pb_steps').upsert(vals,{onConflict:'guide_id,slug'});if(error){msgError(error);return;}
 const {error:revError}=await sb.from('pb_revisions').insert({guide_id:ui.guide,step_slug:slug,actor_id:me.id,action:old?'edit_walkthrough_step':'add_walkthrough_step',previous_value:old||null,next_value:vals});
 if(revError)notify('Walkthrough saved; revision history needs checking.');
 closeModal();await loadData();notify('Guided step saved to Supabase');
}

  if(!reply||typeof reply.answer!=='string')throw Error('The AI response was incomplete. Try again.');
  pbAi.messages.push({role:'assistant',result:reply,saved:false});
 }catch(e){pbAi.error=e?.message||'The assistant could not answer right now. Use the regular guide.';pbAi.question=question;pbAi.messages.pop();}
 finally{pbAi.loading=false;render();pbAiScroll();}
}
async function pbAiSaveNote(index){
 const entry=pbAi.messages[index],p=entry?.result?.proposal;
 if(!p||entry.saved||pbAi.busyNote>=0||!authed())return;
 const valid=data.steps.some(s=>s.guide_id===p.guide_id&&s.slug===p.step_slug)||(String(p.step_slug||'').startsWith('notebook--')&&!!nbPersisted(p.guide_id)?.sections.some(s=>p.step_slug==='notebook--'+s.id)),g=guide(p.guide_id);
 if(!valid||!g){pbAi.error='That reference has changed. Ask the assistant again.';render();return}
 const text=String(p.text||'').trim();if(!text||text.length>450)return;
 if(!window.confirm('Save this shared note under '+g.title+'?\n\n'+text))return;
 pbAi.busyNote=index;render();
 try{const result=await sb.from('pb_annotations').insert({guide_id:p.guide_id,step_slug:p.step_slug,author_id:me.id,kind:'note',note_text:text,color:'#f5d94b'});
  if(result.error)throw result.error;
  entry.saved=true;await loadData();notify('Shared Playbook note saved');
 }catch(e){pbAi.error=e?.message||'Could not save that note.';}finally{pbAi.busyNote=-1;render();pbAiScroll();}
}
document.addEventListener('submit',e=>{if(e.target?.id==='pb-ai-form'){e.preventDefault();e.stopImmediatePropagation();pbAi.question=String(document.querySelector('#pb-ai-question')?.value||'').slice(0,1000);void pbAiAsk()}},true);
document.addEventListener('input',e=>{if(e.target?.id==='pb-ai-question')pbAi.question=String(e.target.value||'').slice(0,1000)},true);
document.addEventListener('click',e=>{
 const btn=e.target.closest('button[data-pb-ai],button[data-pb-ai-ref]');if(!btn)return;
 e.preventDefault();e.stopImmediatePropagation();if(!authed())return;
 if(btn.dataset.pbAi==='new-chat'){if(pbAi.loading)return;pbAi={question:'',loading:false,error:'',messages:[],busyNote:-1};render();document.getElementById('pb-ai-question')?.focus();return;}
 if(btn.dataset.pbAi==='save-note'){void pbAiSaveNote(Number(btn.dataset.msgIndex));return;}
 const id=btn.dataset.pbAiRef,slug=btn.dataset.pbAiStep;
 if(!guide(id))return;
 navigate('reader',id);if(String(slug).startsWith('notebook--')){tx.view='walkthrough';render();setTimeout(()=>{const elem=document.getElementById('nb-'+slug.slice('notebook--'.length));if(elem?.tagName==='DETAILS')elem.open=true;elem?.scrollIntoView({behavior:'smooth',block:'center'})},80)}else{tx.view='reference';ui.open[openKey(id,slug)]=true;render();setTimeout(()=>{const el=[...document.querySelectorAll('[data-step]')].find(x=>x.dataset.step===slug);el?.scrollIntoView({behavior:'smooth',block:'center'})},80)};
},true);


// Personal annotations are separate from official guide steps and shared team notes.
// Saved on this device per signed-in user and guide; no customer information should be entered.
const NB_PERSONAL_COLORS=['#172b43','#d94747','#2579d9','#269c69','#f2cb34','#9b5fce'];
let nbPersonal={tool:'read',color:'#f2cb34',marks:[],guide:'',drawing:null,ready:false};
function nbPersonalKey(){return 'playbook-personal-v1:'+(me?.id||'guest')+':'+ui.guide}
function nbPersonalLoad(){
 const key=nbPersonalKey();
 if(nbPersonal.guide===key)return;
 nbPersonal.guide=key;nbPersonal.tool='read';nbPersonal.drawing=null;
 try{const marks=JSON.parse(localStorage.getItem(key)||'[]');nbPersonal.marks=Array.isArray(marks)?marks.slice(-450):[]}catch{nbPersonal.marks=[]}
}
function nbPersonalSave(){try{localStorage.setItem(nbPersonalKey(),JSON.stringify(nbPersonal.marks.slice(-450)))}catch{notify('Personal notes could not be saved on this device')}}
function nbPersonalToolbar(){
 nbPersonalLoad();
 const options=[['read','↕ Read only'],['pen','✎ Pen'],['highlight','▰ Highlight'],['text','T Text'],['erase','⌫ Erase']];
 return '<div class="nb-personal-dock" role="toolbar" aria-label="Personal notebook tools">'+options.map(([tool,label])=>'<button type="button" data-personal-tool="'+tool+'" class="'+(nbPersonal.tool===tool?'active':'')+'" aria-pressed="'+(nbPersonal.tool===tool)+'">'+label+'</button>').join('')+'<button type="button" data-personal-undo '+(!nbPersonal.marks.length?'disabled':'')+' title="Undo last personal mark">↶ Undo</button><div class="nb-personal-colors">'+NB_PERSONAL_COLORS.map(c=>'<button type="button" data-personal-color="'+c+'" class="nb-personal-color '+(nbPersonal.color===c?'active':'')+'" style="background:'+c+'" aria-label="Select '+c+' ink" title="'+c+'"></button>').join('')+'</div></div>';
}
function nbPersonalCanvas(){
 const paper=document.querySelector('.nb-paper'),canvas=paper?.querySelector('.nb-personal-layer');
 if(!canvas||!paper)return;
 nbPersonalLoad();
 const w=paper.clientWidth,h=paper.scrollHeight;
 const dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.round(w*dpr));canvas.height=Math.max(1,Math.round(h*dpr));
 canvas.style.width=w+'px';canvas.style.height=h+'px';
 canvas.classList.toggle('is-active',nbPersonal.tool!=='read');
 const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
 const draw=m=>{
  if(m.kind==='text')return;
  const pts=m.points||[];if(!pts.length)return;
  ctx.save();ctx.globalAlpha=m.kind==='highlight'?.32:1;ctx.strokeStyle=m.color||'#172b43';ctx.lineWidth=m.kind==='highlight'?20:2.8;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  pts.forEach((pt,i)=>{const x=pt[0]*w,y=pt[1];i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
  if(pts.length===1){ctx.lineTo(pts[0][0]*w+.1,pts[0][1]+.1)}
  ctx.stroke();ctx.restore();
 };
 nbPersonal.marks.forEach(draw);
 if(nbPersonal.drawing)draw(nbPersonal.drawing);
 paper.querySelectorAll('.nb-personal-text').forEach(el=>el.remove());
 for(const mark of nbPersonal.marks.filter(m=>m.kind==='text')){
  const el=document.createElement('div');el.className='nb-personal-text';el.textContent=mark.text;el.style.color=mark.color;el.style.left=(mark.x*w)+'px';el.style.top=mark.y+'px';paper.appendChild(el);
 }
 canvas.onpointerdown=e=>{
  if(nbPersonal.tool==='read')return;
  const r=canvas.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,e.clientY-r.top);
  if(nbPersonal.tool==='text'){
   const text=prompt('Personal notebook note (saved on this device):');if(text?.trim()){nbPersonal.marks.push({kind:'text',x,y,color:nbPersonal.color,text:text.trim().slice(0,400)});nbPersonalSave();nbPersonalCanvas()}return;
  }
  if(nbPersonal.tool==='erase'){
   const near=m=>m.kind==='text'?Math.hypot((m.x-x)*w,m.y-y)<65:(m.points||[]).some(p=>Math.hypot((p[0]-x)*w,p[1]-y)<28);
   const ix=nbPersonal.marks.findLastIndex(near);
   if(ix>=0){nbPersonal.marks.splice(ix,1);nbPersonalSave();nbPersonalCanvas()}
   return;
  }
  nbPersonal.drawing={kind:nbPersonal.tool,color:nbPersonal.color,points:[[x,y]]};
  try{canvas.setPointerCapture(e.pointerId)}catch{}
  e.preventDefault();nbPersonalCanvas();
 };
 canvas.onpointermove=e=>{
  if(!nbPersonal.drawing)return;
  const r=canvas.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,e.clientY-r.top);
  nbPersonal.drawing.points.push([x,y]);
  if(nbPersonal.drawing.points.length>1000)nbPersonal.drawing.points.splice(1,1);
  e.preventDefault();nbPersonalCanvas();
 };
 const finish=e=>{if(!nbPersonal.drawing)return;nbPersonal.marks.push(nbPersonal.drawing);nbPersonal.drawing=null;nbPersonalSave();nbPersonalCanvas();e.preventDefault()};
 canvas.onpointerup=finish;canvas.onpointercancel=finish;
}
const nbPersonalOldRender=render;
render=function(){nbPersonalOldRender();if(authed()&&ui.page==='reader'&&tx.view!=='reference'&&document.querySelector('.nb-personal-layer'))requestAnimationFrame(nbPersonalCanvas)};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-personal-tool],[data-personal-color],[data-personal-undo]');if(!t)return;
 e.preventDefault();e.stopImmediatePropagation();
 if(t.dataset.personalTool)nbPersonal.tool=t.dataset.personalTool;
 if(t.dataset.personalColor)nbPersonal.color=t.dataset.personalColor;
 if(t.hasAttribute('data-personal-undo')){nbPersonal.marks.pop();nbPersonalSave()}
 render();
},true);
window.addEventListener('resize',()=>{if(document.querySelector('.nb-personal-layer'))requestAnimationFrame(nbPersonalCanvas)});

</script></body></html>
